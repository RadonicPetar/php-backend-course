<!DOCTYPE html>
<html lang="hr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebShop - početna stranica</title>
        <link rel="stylesheet" href="css/stil.css">
    </head>
    <body>
        <header>
            <h1>WebShop</h1>
            <p>Dobro došli na našu web trgovinu</p>
        </header>

        <nav>
            <a href="index.html">Početna</a>
            <a href="kategorije.html">Kategorije</a>
            <a href="opisnekategorije.html">Opisne kategorije</a>
            <a href="proizvodi.html" class="active">Proizvodi</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>

        <main>
            <h2>Unos novog proizvoda</h2>

           <form action="" method="POST">
            <label>Naziv proizvoda:</label>
            <input type="text" name="naziv">

            <label>Kategorija:</label>
            <select>
                <option>Elektronika</option>
                <option>Odjeća</option>
                <option>Knjige</option>
            </select>

            <label>Količina:</label>
            <input type="number">

            <label>Cijena:</label>
            <input type="number" step="0.01">

            <button type="submit">Spremi</button>

           </form>
        </main>

        <footer>
            Copyright &copy; 2026 WebShop | Sva prava pridržana
        </footer>
    </body>
</html>
